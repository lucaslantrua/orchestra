[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
orchestra-domain = { path = "crates/orchestra-domain" }
orchestra-state = { path = "crates/orchestra-state" }
orchestra-scheduler = { path = "crates/orchestra-scheduler" }
orchestra-controller = { path = "crates/orchestra-controller" }
orchestra-api = { path = "crates/orchestra-api" }
orchestra-pki = { path = "crates/orchestra-pki" }

anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "service", "tokio"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
sha2 = "0.11"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
x509-parser = "0.18"
